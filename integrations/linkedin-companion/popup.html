<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JobSmart Companion</title>
  <style>
    body{font:14px system-ui,-apple-system,sans-serif;min-width:300px;padding:16px;color:#172033;margin:0}
    h1{font-size:17px;margin:0 0 8px}p{color:#64748b;line-height:1.45;margin:8px 0}
    label{display:block;font-size:12px;color:#475569;margin:12px 0 5px}
    input[type=url],input[type=text]{box-sizing:border-box;width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px}
    .check{display:flex;align-items:center;gap:8px;font-size:13px;margin:12px 0}
    button{width:100%;margin-top:10px;padding:10px;border:0;border-radius:8px;background:#0f172a;color:white;cursor:pointer}
    button.secondary{background:#e2e8f0;color:#172033}.status{margin-top:10px;font-size:12px;min-height:18px}
    .note{font-size:11px;color:#64748b}.paired{color:#047857;font-weight:600}
  </style>
</head>
<body>
  <h1>JobSmart LinkedIn Companion</h1>
  <p>配對後可在你造訪 LinkedIn 時使用填表助手。頁面同步預設關閉，需在 JobSmart 設定中另外開啟。每次填表都要先在 JobSmart 核准；外掛不會代按送出。</p>
  <label for="endpoint">JobSmart 網址</label>
  <input id="endpoint" type="url" value="http://localhost:3004" autocomplete="url">
  <label for="pairCode">從 JobSmart 設定頁取得一次性配對碼</label>
  <input id="pairCode" type="text" autocomplete="off" spellcheck="false" placeholder="貼上配對碼">
  <button id="pair">配對外掛</button>
  <label class="check"><input id="enabled" type="checkbox" checked> 啟用頁面同步與填表</label>
  <button id="save" class="secondary">儲存設定</button>
  <button id="disconnect" class="secondary">清除此裝置配對</button>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <p class="note">外掛不會讀取 LinkedIn 密碼或 Cookie。你可在 JobSmart「設定 → LinkedIn 外掛」撤銷此裝置權限。</p>
  <script src="popup.js"></script>
</body>
</html>
